name: CI

on: push

jobs:
  test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest --junitxml=report.xml

      - name: Send report to localhost receiver
        if: always()
        run: python scripts/make_report.py
        env:
          RECEIVER_URL: ${{ secrets.RECEIVER_URL }}
          RECEIVER_TOKEN: ${{ secrets.RECEIVER_TOKEN }}

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4