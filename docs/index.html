<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assignment Portal (Demo)</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
  input { display: block; margin: 4px 0 10px; padding: 6px; width: 100%; box-sizing: border-box; }
  .err { color: #c00; } .ok { color: #070; }
</style>
</head>
<body>
<h1>Assignment Submission Portal</h1>
<p><small>Static demo - Version 1. Data is stored in your browser only.</small></p>
<div id="msg"></div>
<form id="f">
  Name <input id="name">
  Registration No <input id="reg_no">
  Assignment Title <input id="title">
  Submission URL <input id="url">
  <button type="submit">Submit</button>
</form>
<h2>Saved Submissions</h2>
<ul id="list"></ul>

<script>
const KEY = "submissions";
function load() { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return []; } }
function save(a) { try { localStorage.setItem(KEY, JSON.stringify(a)); } catch (e) {} }
function validUrl(u) {
  if (/\s/.test(u)) return false;
  try { const p = new URL(u); return p.protocol === "http:" || p.protocol === "https:"; }
  catch (e) { return false; }
}
function render() {
  const ul = document.getElementById("list");
  ul.innerHTML = "";
  const subs = load();
  if (!subs.length) {
    const li = document.createElement("li");
    li.textContent = "No submissions yet.";
    ul.appendChild(li);
    return;
  }
  subs.forEach(s => {
    const li = document.createElement("li");
    li.append(s.name + " | " + s.reg_no + " | " + s.title + " | ");
    const a = document.createElement("a");
    a.href = s.url; a.textContent = s.url;
    li.appendChild(a);
    ul.appendChild(li);
  });
}
document.getElementById("f").addEventListener("submit", function (ev) {
  ev.preventDefault();
  const v = {};
  ["name", "reg_no", "title", "url"].forEach(k => v[k] = document.getElementById(k).value.trim());
  const errors = [];
  if (!v.name) errors.push("Name is required.");
  if (!v.reg_no) errors.push("Registration number is required.");
  if (!v.title) errors.push("Assignment title is required.");
  if (!v.url) errors.push("Submission URL is required.");
  else if (!validUrl(v.url)) errors.push("Submission URL is invalid.");
  const msg = document.getElementById("msg");
  msg.innerHTML = "";
  if (errors.length) {
    errors.forEach(e => { const p = document.createElement("p"); p.className = "err"; p.textContent = e; msg.appendChild(p); });
    return;
  }
  const subs = load(); subs.push(v); save(subs);
  const p = document.createElement("p"); p.className = "ok"; p.textContent = "Submission saved!";
  msg.appendChild(p);
  this.reset();
  render();
});
render();
</script>
</body>
</html>
