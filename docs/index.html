<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assignment Portal Demo</title>
</head>
<body>
  <h1>Assignment Submission Portal (Demo)</h1>
  <p><i>Static demo: submissions are saved in this browser only.</i></p>

  <div id="msg"></div>

  <form id="f">
    Name: <input id="name"><br><br>
    Registration No: <input id="reg"><br><br>
    Assignment Title: <input id="title"><br><br>
    Submission URL: <input id="url"><br><br>
    <button type="submit">Submit</button>
  </form>

  <h2>Saved Submissions</h2>
  <table border="1" id="t">
    <tr><th>Name</th><th>Reg No</th><th>Title</th><th>URL</th></tr>
  </table>

<script>
function validUrl(u) {
  try {
    const x = new URL(u);
    return (x.protocol === "http:" || x.protocol === "https:") && x.hostname.includes(".");
  } catch (e) { return false; }
}
function load() {
  try { return JSON.parse(localStorage.getItem("subs") || "[]"); } catch (e) { return []; }
}
function save(a) {
  try { localStorage.setItem("subs", JSON.stringify(a)); } catch (e) {}
}
function render() {
  const t = document.getElementById("t");
  t.innerHTML = "<tr><th>Name</th><th>Reg No</th><th>Title</th><th>URL</th></tr>";
  load().forEach(s => {
    const r = t.insertRow();
    [s.name, s.reg, s.title, s.url].forEach(v => { r.insertCell().textContent = v; });
  });
}
document.getElementById("f").addEventListener("submit", e => {
  e.preventDefault();
  const v = {
    name: document.getElementById("name").value.trim(),
    reg: document.getElementById("reg").value.trim(),
    title: document.getElementById("title").value.trim(),
    url: document.getElementById("url").value.trim()
  };
  const errs = [];
  if (!v.name) errs.push("Name is required.");
  if (!v.reg) errs.push("Registration number is required.");
  if (!v.title) errs.push("Assignment title is required.");
  if (!v.url) errs.push("Submission URL is required.");
  else if (!validUrl(v.url)) errs.push("Submission URL is invalid.");
  const m = document.getElementById("msg");
  if (errs.length) {
    m.innerHTML = errs.map(x => '<p style="color:red"></p>').join("");
    m.querySelectorAll("p").forEach((p, i) => p.textContent = errs[i]);
    return;
  }
  const a = load(); a.push(v); save(a);
  m.innerHTML = '<p style="color:green">Submission saved.</p>';
  document.getElementById("f").reset();
  render();
});
render();
</script>
</body>
</html>
